function sortBy(v){

function setView(v){
 if(v===view && document.getElementById('listPage').style.display!=='none') {closePopup();return;}
 if(view==='list') listScrollTop=document.getElementById('listPage').scrollTop;

 document.getElementById('cards').style.display=v==='map'?'':'none';

 else {ordered();drawMarkers();drawCards();requestAnimationFrame(()=>{if(selected)centerMapOn(selected);document.querySelector(`#cards [data-id="${selected}"]`)?.scrollIntoView({inline:'center',block:'nearest'});});}

// v4: map and card selection are bidirectional. Both layers use the same transform.
let mapOffsetX=0,mapOffsetY=0,suppressSwipeUntil=0,swipeTimer=0;
function updateMapTransform(){
 const m=document.getElementById('map');const w=m.clientWidth,h=m.clientHeight;
 const tx=mapOffsetX*w/100,ty=mapOffsetY*h/100;
 document.getElementById('mapArt').style.transform=`translate(${tx}px,${ty}px) scale(${zoom})`;
 document.getElementById('mapPins').style.transform=`translate(${tx}px,${ty}px) scale(${zoom})`;
}
function centerMapOn(id){
 if(!positions[id])return;
 // Center within the unobscured area above the carousel, not behind the card.
 const m=document.getElementById('map'),h=m.clientHeight;
 const cards=document.getElementById('cards');
 const cardTop=cards.getBoundingClientRect().top-m.getBoundingClientRect().top;
 const clearBottom=Math.max(180,Math.min(h,cardTop));
 const targetY=Math.max(110,clearBottom*.52);
 mapOffsetX=(50-positions[id][0]*zoom)-(50*(1-zoom));
 mapOffsetY=(targetY/h*100-positions[id][1]*zoom)-(50*(1-zoom));
 updateMapTransform();
}
const carousel=document.getElementById('cards');
function commitCarouselSelection(){
 if(view!=='map'||Date.now()<suppressSwipeUntil)return;
 const items=[...carousel.querySelectorAll('.card')];if(!items.length)return;
 const middle=carousel.getBoundingClientRect().left+carousel.clientWidth/2;
 const closest=items.reduce((a,b)=>Math.abs((a.getBoundingClientRect().left+a.getBoundingClientRect().right)/2-middle)<Math.abs((b.getBoundingClientRect().left+b.getBoundingClientRect().right)/2-middle)?a:b);
 const id=Number(closest.dataset.id);
 if(id!==selected){selected=id;drawMarkers();centerMapOn(id);items.forEach(x=>x.classList.toggle('active',Number(x.dataset.id)===id));}
}
carousel.addEventListener('scroll',()=>{clearTimeout(swipeTimer);swipeTimer=setTimeout(commitCarouselSelection,150)},{passive:true});
carousel.addEventListener('scrollend',()=>{clearTimeout(swipeTimer);commitCarouselSelection()});
