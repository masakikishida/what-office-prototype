<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>What? Office｜駅マスタ</title><style>
:root{--bg:#f5f5f3;--panel:#fff;--line:#dddcd7;--ink:#20211f;--muted:#777873;--dark:#252724;--soft:#f0f0ed;--radius:10px}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:var(--ink);background:var(--bg);font-size:13px}
.app{display:grid;grid-template-columns:210px minmax(760px,1fr);min-height:100vh}aside{background:#20221f;color:#eee;padding:20px 14px;position:fixed;inset:0 auto 0 0;width:210px;display:flex;flex-direction:column}.brand{font-size:19px;font-weight:800;padding:4px 8px 22px}.brand small{display:block;font-size:10px;color:#aeb0aa;font-weight:500;margin-top:4px}nav a{display:block;color:#cfd0cc;text-decoration:none;padding:10px 11px;border-radius:7px;margin:2px 0}nav a.active{background:#373a35;color:#fff;font-weight:700}.user{margin-top:auto;border-top:1px solid #454742;padding:14px 8px 0;color:#bfc0bc}.logout{margin-top:7px;color:#fff}main{grid-column:2;padding:24px 28px 80px}.wrap{max-width:1120px;margin:auto}.top{display:flex;align-items:center;margin-bottom:18px}.title{font-size:22px;font-weight:800;margin-right:auto}.sub{color:var(--muted);margin-top:5px}button,.btn{border:1px solid #c8c8c3;background:#fff;border-radius:6px;padding:8px 12px;font-weight:650;color:#333}.primary{background:var(--dark);color:#fff;border-color:var(--dark)}.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin:14px 0;overflow:hidden}.card h2{font-size:15px;margin:0;padding:13px 16px;background:#2c2e2a;color:#fff}.pad{padding:16px}.toolbar{display:flex;gap:9px;align-items:end;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}.f label{display:block;font-size:11px;color:#666;margin-bottom:5px}input,select{font:inherit;border:1px solid #cfcfca;background:#fafafa;border-radius:5px;padding:8px 9px}.wide{min-width:280px}.stats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.stat{background:#fff;border:1px solid var(--line);padding:9px 12px;border-radius:7px}.table{width:100%;border-collapse:collapse;background:#fff}.table th{font-size:11px;color:#666;text-align:left;background:#eee;padding:9px 8px;border-bottom:1px solid #ddd}.table td{padding:10px 8px;border-bottom:1px solid #ecece8;vertical-align:middle}.photo{width:44px;height:34px;background:linear-gradient(135deg,#ddd,#999);border-radius:4px;color:#fff;display:grid;place-items:center;font-size:9px}.muted{color:#777}.chip{display:inline-block;background:#eee;padding:4px 7px;border-radius:12px;font-size:11px}.listrow{display:grid;grid-template-columns:44px 64px 1fr 80px 90px 130px;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid #eee}.rank{font-weight:800;font-size:16px}.actions{display:flex;gap:5px}.split{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.formrow{display:grid;grid-template-columns:150px 1fr;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.notice{background:#f1f1ee;padding:11px 13px;border-radius:7px;color:#555}.danger{border-color:#c9a9a9}.danger h2{background:#5a3333}@media(max-width:900px){.app{grid-template-columns:1fr}aside{display:none}main{grid-column:1;padding:18px 12px}.split{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside><div class="brand">What? Office<small>ADMINISTRATION</small></div><nav><a class="">物件</a><a class="">PICK UP</a><a class="">元付業者</a><a class="">会員</a><a class="">通知管理</a><a class="active">駅マスタ</a><a class="">目的マスタ</a><a class="">特徴マスタ</a><a class="">スタッフ</a><a class="">ゴミ箱</a></nav><div class="user">岸田 真樹<div class="logout">ログアウト</div></div></aside><main><div class="wrap"><div class="notice" style="margin-bottom:14px"><b>仕様準拠モック</b>｜「統合マスタ」「管理画面整理」「管理画面整理（ビジュアル）」を基準にUI化。見た目・余白・UI部品の具体デザインは参考です。</div><div class="top"><div><div class="title">駅マスタ</div><div class="sub">東京都内の正規路線・駅データから利用対象を有効化</div></div></div><div class="card"><h2>利用駅の有効化</h2><div class="pad"><div class="formrow"><b>路線</b><select><option>東急田園都市線</option><option>東京メトロ半蔵門線</option><option>東急東横線</option></select></div><div class="formrow"><b>利用駅</b><div><label><input type="checkbox" checked> 渋谷</label>　<label><input type="checkbox" checked> 池尻大橋</label>　<label><input type="checkbox" checked> 三軒茶屋</label>　<label><input type="checkbox"> 桜新町</label></div></div></div></div><div class="notice">駅名やIDを手入力して新規作成するマスタではありません。</div></div></main></div></body></html>
